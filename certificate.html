<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVAROG TEAM | Сертифікат підтримки</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap');

        body { 
            background: #121212; display: flex; flex-direction: column; align-items: center; 
            padding: 40px 20px; font-family: 'Montserrat', sans-serif;
        }

        .cert-container { 
            width: 850px; height: 600px; 
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            color: #fff; padding: 50px; position: relative;
            border: 2px solid #f0b48c; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .header-logos { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }
        .logo { width: 80px; height: auto; }
        
        h1 { font-size: 2.5rem; color: #f0b48c; text-transform: uppercase; margin: 10px 0; letter-spacing: 2px; }
        .subtitle { font-size: 1.1rem; color: #aaa; margin-bottom: 40px; }
        
        .code-box { 
            margin-top: 20px; background: rgba(240, 180, 140, 0.1); 
            border: 1px solid #f0b48c; padding: 20px 40px; border-radius: 10px; 
        }
        .code-label { font-size: 0.9rem; color: #f0b48c; text-transform: uppercase; }
        .code-val { font-size: 3rem; font-weight: 900; letter-spacing: 5px; color: #fff; }

        .footer-cert { margin-top: auto; font-size: 0.8rem; color: #666; width: 100%; border-top: 1px solid #333; padding-top: 20px; }

        .print-btn { 
            margin-top: 30px; padding: 15px 40px; background: #f0b48c; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; 
            transition: 0.3s;
        }
        .print-btn:hover { background: #dcb092; transform: translateY(-3px); }

        @media print { 
            body { background: #fff; padding: 0; }
            .cert-container { border: 5px solid #f0b48c; box-shadow: none; color: #000; background: #fff; }
            h1, .code-val { color: #000; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>

<div class="cert-container" id="cert">
    <div class="header-logos">
        <img src="logo.png" class="logo" alt="SVAROG">
        <img src="SvarogTeam.png" class="logo" alt="SVAROG TEAM">
    </div>
    
    <h1>Сертифікат підтримки</h1>
    <p class="subtitle">Цим документом підтверджуємо внесок у технологічну перевагу SVAROG TEAM.</p>
    
    <div class="code-box">
        <div class="code-label">Ваш унікальний код</div>
        <div class="code-val" id="cert-code">...</div>
    </div>

    <div class="footer-cert">
        Дякуємо за віру в нашу справу та підтримку України. Разом до перемоги.
    </div>
</div>

<button class="print-btn" onclick="window.print()">Зберегти як PDF / Друк</button>

<script>
    // Замініть config на свій або переконайтеся, що Firebase вже підключено у проєкті
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if(code) {
        db.collection("promocodes").doc(code.toUpperCase()).get().then(doc => {
            if(doc.exists) {
                document.getElementById('cert-code').innerText = doc.data().code;
            } else {
                document.getElementById('cert-code').innerText = "НЕЗНАЙДЕНО";
            }
        });
    } else {
        document.getElementById('cert-code').innerText = "ПОМИЛКА";
    }
</script>
</body>
</html>
