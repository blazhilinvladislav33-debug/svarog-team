<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVAROG TEAM | Сертифікат</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAz5vZlnI7XwGhSXlKkX3DNAL13ECNegNk",
            authDomain: "svarog-team.firebaseapp.com",
            projectId: "svarog-team",
            storageBucket: "svarog-team.firebasestorage.app",
            messagingSenderId: "311449325528",
            appId: "1:311449325528:web:b254c6aed4fea56fe96cad",
            measurementId: "G-56T1VN72PF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap');
        body { background: #121212; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; font-family: 'Montserrat', sans-serif; }
        
        /* Компактніший контейнер */
        .cert-container { 
            width: 800px; height: 450px; 
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
            color: #fff; padding: 30px; position: relative;
            border: 2px solid #f0b48c; border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .header-logos { display: flex; gap: 30px; margin-bottom: 20px; align-items: center; }
        .logo-main { width: 100px; height: auto; } /* Збільшений логотип */
        .logo-team { width: 140px; height: auto; }
        
        h1 { font-size: 2rem; color: #f0b48c; text-transform: uppercase; margin: 5px 0; }
        .subtitle { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
        
        .code-box { margin-top: 10px; background: rgba(240, 180, 140, 0.05); border: 1px solid #f0b48c; padding: 15px 30px; border-radius: 8px; }
        .code-val { font-size: 2.5rem; font-weight: 900; color: #fff; }

        .promo-list { margin-top: 40px; width: 100%; max-width: 600px; }
        .promo-item { display: flex; justify-content: space-between; padding: 10px; background: #222; margin-bottom: 5px; border-radius: 5px; color: #fff; cursor: pointer; transition: 0.2s; }
        .promo-item:hover { background: #333; }

        .print-btn { margin-top: 30px; padding: 12px 30px; background: #f0b48c; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        @media print { .print-btn, .promo-list { display: none; } body { background: #fff; } .cert-container { border: 3px solid #f0b48c; color: #000; background: #fff; } h1, .code-val { color: #000; } }
    </style>
</head>
<body>

<div class="cert-container">
    <div class="header-logos">
        <img src="logo.png" class="logo-main" alt="Logo">
        <img src="SvarogTeam.png" class="logo-team" alt="SVAROG TEAM">
    </div>
    
    <h1>Сертифікат підтримки</h1>
    <p class="subtitle">Ваш внесок наближає перемогу SVAROG TEAM.</p>
    
    <div class="code-box">
        <div class="code-val" id="cert-code">ВЕРІТЬ...</div>
    </div>
</div>

<button class="print-btn" onclick="window.print()">Друк сертифіката</button>

<div class="promo-list" id="promo-list">
    <h3 style="color:#fff; margin-bottom:10px;">Активні промокоди для вибору:</h3>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    // Логіка вибору коду
    if(code) {
        document.getElementById('cert-code').innerText = code.toUpperCase();
    }

    // Відображення списку всіх промокодів
    db.collection("promocodes").where("active", "==", true).get().then(snapshot => {
        const list = document.getElementById('promo-list');
        snapshot.forEach(doc => {
            const p = doc.data();
            list.innerHTML += `
                <div class="promo-item" onclick="window.location.href='?code=${p.code}'">
                    <span>${p.code}</span>
                    <span>Знижка ${p.discount}%</span>
                </div>
            `;
        });
    });
</script>
</body>
</html>
