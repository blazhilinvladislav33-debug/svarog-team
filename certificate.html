<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>SVAROG TEAM | Сертифікат підтримки</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAz5vZlnI7XwGhSXlKkX3DNAL13ECNegNk",
            authDomain: "svarog-team.firebaseapp.com",
            projectId: "svarog-team",
            storageBucket: "svarog-team.firebasestorage.app",
            messagingSenderId: "311449325528",
            appId: "1:311449325528:web:b254c6aed4fea56fe96cad",
            measurementId: "G-56T1VN72PF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap');
        
        body { 
            background: #121212; display: flex; flex-direction: column; align-items: center; 
            padding: 40px 20px; font-family: 'Montserrat', sans-serif; min-height: 100vh;
        }
        
        /* Контейнер сертифіката */
        .cert-container { 
            width: 800px; height: 450px; 
            background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%) !important;
            color: #fff; padding: 30px; position: relative;
            border: 2px solid #f0b48c; border-radius: 15px;
            box-shadow: inset 0 0 35px 5px rgba(240, 180, 140, 0.15), 0 15px 40px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            box-sizing: border-box;
            /* Важливо для збереження кольорів при друку в браузерах */
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .header-logos { display: flex; gap: 30px; margin-bottom: 20px; align-items: center; }
        .logo-main { width: 90px; height: auto; }
        .logo-team { width: 180px; height: auto; }
        
        h1 { font-size: 2rem; color: #f0b48c; text-transform: uppercase; margin: 5px 0; letter-spacing: 2px; }
        
        .promo-wrapper { margin: 25px 0; display: flex; flex-direction: column; align-items: center; }
        .code-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .code-box { 
            padding: 15px 40px; 
            border: 2px solid #f0b48c;
            border-radius: 8px;
            box-shadow: 0 0 10px 5px rgba(240, 180, 140, 0.15);
            background: rgba(0, 0, 0, 0.3);
        }
        .code-val { font-size: 2.2rem; font-weight: 900; color: #fff; }

        .footer-cert { 
            margin-top: auto; font-size: 0.85rem; color: #aaa; width: 100%; 
            border-top: 1px solid #333; padding-top: 15px; font-style: italic;
        }

        .btn-wrapper { display: flex; gap: 15px; margin-top: 30px; }
        .print-btn { padding: 12px 30px; background: #f0b48c; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .print-btn:hover { background: #dcb092; }
        .png-btn { padding: 12px 30px; background: #222; border: 2px solid #f0b48c; color: #f0b48c; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .png-btn:hover { background: #f0b48c; color: #121212; }

        .promo-list { margin-top: 40px; width: 100%; max-width: 600px; }
        .promo-item { display: flex; justify-content: space-between; padding: 12px 20px; background: #222; margin-bottom: 8px; border-radius: 8px; color: #fff; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .promo-item:hover { background: #2a2a2a; border-color: #f0b48c; }

        /* Стилі спеціально для друку */
        @media print { 
            /* Робимо орієнтацію горизонтальною (альбомною) */
            @page { 
                size: landscape; 
                margin: 0;
            } 
            body { 
                background: transparent !important; 
                padding: 0; 
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            } 
            .btn-wrapper, .promo-list { display: none !important; } 
            .cert-container { 
                border: 2px solid #f0b48c !important; 
                box-shadow: inset 0 0 35px 5px rgba(240, 180, 140, 0.15) !important;
                margin: 0 !important; 
                /* Примусове збереження темного градієнту фону */
                background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%) !important;
                color: #fff !important;
            } 
            h1 { color: #f0b48c !important; }
            .code-val { color: #fff !important; }
            .footer-cert { color: #aaa !important; }
        }
    </style>
</head>
<body>

<div class="cert-container" id="certificate-card">
    <div class="header-logos">
        <img src="logo.png" class="logo-main" alt="Logo">
        <img src="SvarogTeam.png" class="logo-team" alt="SVAROG TEAM">
    </div>
    
    <h1>Сертифікат підтримки</h1>
    
    <div class="promo-wrapper">
        <div class="code-label">ВАШ ПРОМОКОД</div>
        <div class="code-box">
            <div class="code-val" id="cert-code">ОБЕРІТЬ КОД</div>
        </div>
    </div>

    <div class="footer-cert">
        Ми щиро дякуємо за вашу небайдужість та фінансову допомогу. Ваш внесок — це не просто цифри, це наші очі в небі, які наближають неминучу перемогу SVAROG TEAM над ворогом.
    </div>
</div>

<div class="btn-wrapper">
    <button class="print-btn" onclick="window.print()">Друк сертифіката (PDF)</button>
    <button class="png-btn" onclick="downloadCertificatePNG()">Завантажити PNG</button>
</div>

<div class="promo-list" id="promo-list">
    <h3 style="color:#fff; margin-bottom:15px; text-align: center;">Оберіть промокод для генерації:</h3>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if(code) {
        const codeUpper = code.toUpperCase();
        const docRef = db.collection("promocodes").doc(codeUpper);

        docRef.get().then(doc => {
            if(doc.exists && doc.data().active) {
                const promoData = doc.data();
                
                document.getElementById('cert-code').innerText = promoData.code || doc.id;
                document.getElementById('cert-code').style.color = "#fff";
                document.getElementById('cert-code').style.fontSize = "2.2rem";
                
                // Перевірка на одноразовість сертифіката
                if(promoData.isSingleUse === true) {
                    docRef.update({ active: false }).then(() => {
                        console.log("✓ Одноразовий сертифікат активовано та вимкнено для наступних переглядів.");
                    }).catch(err => {
                        console.error("Помилка зміни статусу промокоду:", err);
                    });
                }
            } else {
                document.getElementById('cert-code').innerText = "ВИКОРИСТАНО / НЕАКТИВНИЙ";
                document.getElementById('cert-code').style.color = "#ff4a4a";
                document.getElementById('cert-code').style.fontSize = "1.5rem";
            }
        }).catch(err => {
            console.error("Помилка завантаження сертифіката:", err);
            document.getElementById('cert-code').innerText = "ПОМИЛКА БАЗИ";
        });
    }

    // Завантаження списку активних кодів для нижнього меню вибору
    db.collection("promocodes").where("active", "==", true).get().then(snapshot => {
        const list = document.getElementById('promo-list');
        
        if (snapshot.empty) {
            list.innerHTML += `<div style="color:#666; text-align:center; font-style:italic;">Немає доступних активних сертифікатів</div>`;
            return;
        }

        snapshot.forEach(doc => {
            const p = doc.data();
            const promoName = p.code || doc.id;
            const singleUseBadge = p.isSingleUse ? " <small style='color:#ffaa00;'>(Одноразовий)</small>" : "";
            
            list.innerHTML += `
                <div class="promo-item" onclick="window.location.href='?code=${promoName}'">
                    <span>${promoName}${singleUseBadge}</span>
                    <span>Знижка ${p.discount}%</span>
                </div>
            `;
        });
    }).catch(err => {
        console.error("Помилка завантаження списку:", err);
    });

    // ФУНКЦІЯ СТВОРЕННЯ ТА СКАЧУВАННЯ PNG КАРТИНКИ
    function downloadCertificatePNG() {
        const element = document.getElementById('certificate-card');
        const currentCode = document.getElementById('cert-code').innerText;
        
        // Налаштування для правильного рендерингу країв та прозорості
        html2canvas(element, {
            backgroundColor: null, // null робить простір навколо закруглених кутів прозорим (справжній PNG)
            scale: 2,             // Збільшує якість картинки у два рази, щоб текст не розмивався
            useCORS: true         // Дозволяє коректно завантажувати логотипи та сторонні картинки
        }).then(canvas => {
            // Перетворюємо у формат картинки
            const image = canvas.toDataURL("image/png");
            
            // Створюємо тимчасове посилання для скачування файлу
            const link = document.createElement('a');
            link.download = `SVAROG_Certificate_${currentCode}.png`;
            link.href = image;
            link.click();
        }).catch(err => {
            console.error("Не вдалося сформувати фото сертифіката:", err);
            alert("Сталася помилка при створенні PNG файлу.");
        });
    }
</script>
</body>
</html>
