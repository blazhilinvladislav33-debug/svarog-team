<!DOCTYPE html>

<head>

<style>
  :root{
    --graphite:#0E0E0F; --plate:#16171A; --iron:#26282D; --bone:#F2EFE9;
    --ash:#C4C7CC; --ember:#D9663D; --copper:#E8A88A; --olive:#7A8450;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--graphite); color:var(--bone); font-family:'Manrope',sans-serif;
        display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  a{ color:inherit; }
  .wordmark{ position:fixed; top:24px; left:24px; font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; color:var(--ash); }
  .wordmark:hover{ color:var(--copper); }
  .code-404{ font-family:'Oswald',sans-serif; font-size:clamp(90px,20vw,220px); font-weight:800; color:var(--ember); line-height:1; letter-spacing:-4px; text-shadow:0 10px 40px rgba(217,102,61,.25); }
  h1{ font-family:'Oswald',sans-serif; font-size:clamp(22px,4vw,32px); text-transform:uppercase; letter-spacing:.02em; margin:10px 0 14px; }
  p{ color:var(--ash); font-size:16px; line-height:1.6; max-width:440px; margin:0 0 32px; }
  .btn-home{ display:inline-block; background:var(--ember); color:var(--bone); text-decoration:none; font-weight:700; font-family:'Manrope',sans-serif; padding:14px 34px; border-radius:2px; transition:.2s; }
  .btn-home:hover{ filter:brightness(1.1); transform:translateY(-2px); }
  .links-row{ margin-top:24px; display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  .links-row a{ color:var(--ash); font-size:13px; text-decoration:none; border-bottom:1px dashed var(--iron); }
  .links-row a:hover{ color:var(--copper); border-color:var(--copper); }
</style>
</head>
