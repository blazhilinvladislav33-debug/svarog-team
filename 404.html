<script>
/* ===== SVAROG SECURITY HELPERS ===== */
// Anti-clickjacking: якщо сайт завантажено в iframe — вихід
(function(){
  if(window.self !== window.top){
    try{ window.top.location = window.self.location; }catch(e){}
    document.documentElement.style.display = 'none';
  }
})();

// Екранування HTML щоб уникнути XSS
function esc(str){
  if(str == null) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#x27;');
}

// Безпечна перевірка URL для посилань (тільки http/https)
// Відносні шляхи (без протоколу) теж пропускаються
function safeURL(url){
  if(!url) return '#';
  const s = String(url).trim();
  // Відносний шлях — безпечний (не містить двокрапки до слешу)
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return s;
  // Блокуємо небезпечні протоколи
  const low = s.toLowerCase().replace(/\s/g,'');
  if(low.startsWith('javascript:')||low.startsWith('vbscript:')) return '#';
  try{
    const u = new URL(s);
    if(u.protocol==='http:'||u.protocol==='https:') return u.href;
  }catch(e){}
  return '#';
}

// Безпечний src для <img>: додатково дозволяє data: та blob: (для фото в чаті та Firebase Storage)
function safeImgSrc(url){
  if(!url) return 'logo.png';
  const s = String(url).trim();
  // Відносний шлях
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) return s;
  const low = s.toLowerCase().replace(/\s/g,'');
  if(low.startsWith('javascript:')||low.startsWith('vbscript:')) return 'logo.png';
  try{
    const u = new URL(s);
    if(['http:','https:','data:','blob:'].includes(u.protocol)) return u.href;
  }catch(e){}
  return 'logo.png';
}

// Rate-limiter для форм/чату (повертає false якщо занадто швидко)
const _rl={};
function rateLimit(key,ms){
  const now=Date.now();
  if(_rl[key]&&now-_rl[key]<ms) return false;
  _rl[key]=now; return true;
}
</script>
