<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAROG | Superadmin Logs</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAz5vZlnI7XwGhSXlKkX3DNAL13ECNegNk",
            authDomain: "svarog-team.firebaseapp.com",
            projectId: "svarog-team",
            storageBucket: "svarog-team.firebasestorage.app",
            messagingSenderId: "311449325528",
            appId: "1:311449325528:web:b254c6aed4fea56fe96cad",
            measurementId: "G-56T1VN72PF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <style>
        :root { --theme-color: #f0b48c; --theme-color-rgb: 240, 180, 140; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            background-color: #121212; background-image: url('bg1.jpg'); background-attachment: fixed;
            background-position: center; background-repeat: no-repeat; background-size: cover;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: -1; }
        
        .navbar { width: 100%; background-color: rgba(20, 20, 20, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: fixed; top: 0; left: 0; z-index: 1000; padding: 15px 20px; text-align: center; }
        .logo { color: var(--theme-color); text-decoration: none; font-weight: 900; letter-spacing: 1px; font-size: 1.2rem; }

        .main-content { margin-top: 80px; width: 100%; max-width: 1400px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { padding: 30px; border-radius: 12px; background: rgba(30, 30, 30, 0.65); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; transition: all 0.3s ease; }
        .container.dashboard-mode { max-width: 100%; }
        
        h1 { color: #ffffff; margin-bottom: 20px; font-size: 1.6rem; text-align: center; }
        
        .form-input { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #ffffff; font-size: 1rem; margin-bottom: 15px; outline: none; }
        .btn { width: 100%; padding: 12px; background: transparent; color: var(--theme-color); border: 2px solid var(--theme-color); border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--theme-color); color: #121212; }
        .error-msg { color: #ff4a4a; margin-top: 15px; display: none; text-align: center; font-weight: bold; }

        /* GRID ЛОГІВ */
        .logs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; width: 100%; margin-top: 20px; }
        .log-window { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; display: flex; flex-direction: column; height: 400px; }
        .log-header { background: rgba(255, 255, 255, 0.05); padding: 12px 15px; font-weight: bold; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 8px; color: var(--theme-color); }
        .log-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        
        .log-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 6px; border-left: 3px solid #888; font-size: 0.85rem; }
        .log-item.chat { border-color: #00bfff; }
        .log-item.news { border-color: #ffaa00; }
        .log-item.shop { border-color: #da70d6; }
        .log-item.payment { border-color: #00ffcc; }
        .log-item.orders { border-color: #ff4a4a; }
        
        .log-meta { display: flex; justify-content: space-between; color: #aaa; margin-bottom: 4px; font-size: 0.75rem; }
        .log-email { color: #fff; font-weight: bold; }
        .log-text { color: #ddd; line-height: 1.4; }

        @media (max-width: 768px) {
            .logs-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container" style="justify-content: center;">
            <a href="index.html" class="logo">🛡️ SVAROG SUPERADMIN AUDIT</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="container" id="login-card">
            <h1>Доступ Супер-Адміна</h1>
            <form onsubmit="handleLogin(event)">
                <input type="email" id="user-email" class="form-input" placeholder="Email" required autocomplete="email">
                <input type="password" id="user-password" class="form-input" placeholder="Password" required>
                <button type="submit" class="btn" id="login-btn-submit">Авторизуватись</button>
                <div class="error-msg" id="error-block"></div>
            </form>
        </div>

        <div class="container dashboard-mode" id="admin-dashboard" style="display: none; background: transparent; border: none; box-shadow: none; padding: 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; flex-wrap:wrap; gap:15px;">
                <h2>Журнал дій адміністраторів</h2>
                <button class="btn" style="width:auto; border-color:#ff4a4a; color:#ff4a4a;" onclick="handleLogout()">Вийти</button>
            </div>

            <div class="logs-grid">
                <div class="log-window">
                    <div class="log-header">💬 Анонімні чати</div>
                    <div class="log-body" id="logs-chat">Завантаження...</div>
                </div>

                <div class="log-window">
                    <div class="log-header">📰 Публікації (Новини/Звіти)</div>
                    <div class="log-body" id="logs-news">Завантаження...</div>
                </div>

                <div class="log-window">
                    <div class="log-header">🛍️ Магазин (Товари/Промокоди)</div>
                    <div class="log-body" id="logs-shop">Завантаження...</div>
                </div>

                <div class="log-window">
                    <div class="log-header">📦 Замовлення</div>
                    <div class="log-body" id="logs-orders">Завантаження...</div>
                </div>

                <div class="log-window">
                    <div class="log-header">⚙️ Реквізити та Налаштування</div>
                    <div class="log-body" id="logs-payment">Завантаження...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let unsubscribeLogs = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const adminDoc = await db.collection("admins").doc(user.email).get();
                    if (adminDoc.exists && adminDoc.data().role === "superadmin") {
                        document.getElementById('login-card').style.display = 'none';
                        document.getElementById('admin-dashboard').style.display = 'block';
                        startListeningToLogs();
                    } else {
                        throw new Error("Немає прав SUPERADMIN.");
                    }
                } catch (e) {
                    showError(e.message);
                    await firebase.auth().signOut();
                }
            } else {
                document.getElementById('login-card').style.display = 'block';
                document.getElementById('admin-dashboard').style.display = 'none';
                if(unsubscribeLogs) unsubscribeLogs();
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-password').value.trim();
            const btn = document.getElementById('login-btn-submit');
            
            btn.disabled = true; btn.innerText = "Перевірка...";
            document.getElementById('error-block').style.display = 'none';

            try {
                await firebase.auth().signInWithEmailAndPassword(email, pass);
            } catch (err) {
                showError("Помилка авторизації: " + err.message);
            } finally {
                btn.disabled = false; btn.innerText = "Авторизуватись";
            }
        }

        async function handleLogout() {
            await firebase.auth().signOut();
        }

        function showError(msg) {
            const el = document.getElementById('error-block');
            el.innerText = msg; el.style.display = 'block';
        }

        function startListeningToLogs() {
            unsubscribeLogs = db.collection("admin_logs")
                .orderBy("timestamp", "desc")
                .limit(200) // Беремо останні 200 подій
                .onSnapshot(snapshot => {
                    const logs = { chat: [], news: [], shop: [], orders: [], payment: [] };
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const type = data.actionType || 'system';
                        
                        // Групування
                        if(type === 'chat') logs.chat.push(data);
                        else if(type === 'news') logs.news.push(data);
                        else if(type === 'shop') logs.shop.push(data);
                        else if(type === 'orders') logs.orders.push(data);
                        else logs.payment.push(data); // Реквізити, налаштування
                    });

                    renderLogWindow('logs-chat', logs.chat, 'chat');
                    renderLogWindow('logs-news', logs.news, 'news');
                    renderLogWindow('logs-shop', logs.shop, 'shop');
                    renderLogWindow('logs-orders', logs.orders, 'orders');
                    renderLogWindow('logs-payment', logs.payment, 'payment');
                }, err => console.error("Помилка читання логів:", err));
        }

        function renderLogWindow(elementId, dataArray, cssClass) {
            const box = document.getElementById(elementId);
            if(!box) return;
            box.innerHTML = "";
            
            if(dataArray.length === 0) {
                box.innerHTML = `<div style="color:#666; text-align:center; margin-top:20px;">Записів немає</div>`;
                return;
            }

            dataArray.forEach(log => {
                let timeStr = "Невідомо";
                if(log.timestamp) {
                    timeStr = new Date(log.timestamp.toMillis()).toLocaleString('uk-UA');
                }
                
                box.innerHTML += `
                    <div class="log-item ${cssClass}">
                        <div class="log-meta">
                            <span class="log-email">${log.adminEmail}</span>
                            <span>${timeStr}</span>
                        </div>
                        <div class="log-text">${log.details}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
