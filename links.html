<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAROG TEAM | Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0d0f0c;
            --panel-bg: #151813;
            --border-olive: #323a2b;
            --tactical-olive: #48543c;
            --tactical-glow: #6e825c;
            --text-sand: #ded7c2;
            --text-dim: #65705b;
            --accent-green: #3cd070;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-sand);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* Шапка профілю */
        .profile {
            text-align: center;
            margin-bottom: 5px;
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2px solid var(--tactical-olive);
            padding: 3px;
            background: var(--panel-bg);
            object-fit: contain; /* Щоб твій логотип не стискався і не деформувався */
        }

        .status-badge {
            position: absolute;
            bottom: 3px;
            right: 3px;
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border: 2px solid var(--bg-dark);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
        }

        .profile h1 {
            font-family: 'Russo One', sans-serif; /* Суворий військовий заголовок */
            font-size: 22px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 12px;
            color: var(--text-sand);
        }

        .profile p {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4px;
        }

        /* Головна картка збору */
        .main-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-olive);
            border-radius: 10px;
            width: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            padding: 0 2px;
        }

        /* Реквізити картки */
        .bank-details {
            background: #090a08;
            border: 1px dashed var(--border-olive);
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .bank-details:hover {
            border-color: var(--tactical-olive);
            background: #111310;
        }

        .card-number {
            font-family: 'Russo One', sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--text-sand);
        }

        .copy-btn {
            font-size: 10px;
            text-transform: uppercase;
            background: var(--border-olive);
            color: var(--text-sand);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        /* Список посилань */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Тактична 3D кнопка */
        .tactical-button {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border-olive);
            color: var(--text-sand);
            padding: 15px 18px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 0 var(--border-olive);
            transform: translateY(-4px);
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tactical-button:hover {
            border-color: var(--tactical-glow);
            color: #fff;
            box-shadow: 0 4px 0 var(--tactical-olive), 0 4px 15px rgba(110, 130, 92, 0.1);
        }

        /* Механічний клік */
        .tactical-button:active {
            transform: translateY(0px);
            box-shadow: 0 0px 0 transparent;
        }

        .button-icon {
            font-size: 16px;
            opacity: 0.7;
            transition: transform 0.2s;
        }

        .tactical-button:hover .button-icon {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Системний підвал */
        .footer {
            margin-top: 10px;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="profile">
        <div class="avatar-wrapper">
            <img src="logo.png" alt="SVAROG" class="avatar">
            <div class="status-badge"></div>
        </div>
        <h1>SVAROG TEAM</h1>
        <p>Command Center Live</p>
    </div>

    <div class="main-card">
        <div class="card-header">
            <span>Цільовий збір</span>
            <span style="color: var(--accent-green); font-weight: 700;">● Активно</span>
        </div>
        
        <a href="https://send.monobank.ua/" target="_blank" class="tactical-button" style="background: var(--tactical-olive); border-color: var(--tactical-glow); box-shadow: 0 4px 0 #2a3124;">
            <span>Перейти на банку Моно</span>
            <span class="button-icon">🏦</span>
        </a>

        <div class="bank-details" onclick="copyCardNumber()">
            <div style="display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 9px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; letter-spacing: 0.5px;">Натисніть для копіювання картки</span>
                <span class="card-number" id="cardNumber">4441 1111 2222 3333</span>
            </div>
            <span class="copy-btn" id="copyBadge">Копіювати</span>
        </div>
    </div>

    <div class="links-list">
        
        <a href="https://t.me/" target="_blank" class="tactical-button">
            <span>Офіційний Telegram Канал</span>
            <span class="button-icon">📱</span>
        </a>

        <a href="#" target="_blank" class="tactical-button">
            <span>Зв'язок з Адміністрацією</span>
            <span class="button-icon">🛡️</span>
        </a>

        <a href="#" target="_blank" class="tactical-button">
            <span>Інструкція користувача</span>
            <span class="button-icon">📄</span>
        </a>

    </div>

    <div class="footer">
        SECURE CONNECT // EST. 2026
    </div>

</div>

<script>
    function copyCardNumber() {
        const cardNumberText = document.getElementById('cardNumber').innerText.replace(/\s/g, '');
        const copyBadge = document.getElementById('copyBadge');
        
        navigator.clipboard.writeText(cardNumberText).then(() => {
            copyBadge.innerText = "Готово!";
            copyBadge.style.background = "var(--tactical-olive)";
            copyBadge.style.color = var(--accent-green);
            
            setTimeout(() => {
                copyBadge.innerText = "Копіювати";
                copyBadge.style.background = "var(--border-olive)";
                copyBadge.style.color = "var(--text-sand)";
            }, 2000);
        });
    }
</script>

</body>
</html>
