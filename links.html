<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAROG TEAM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0c0a;
            --card-bg: #121510;
            --border-color: #242b1f;
            --olive-active: #414d36;
            --text-main: #e3ded2;
            --text-muted: #58634f;
            --green-glow: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 35px 16px;
        }

        .wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Блок профілю */
        .header-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 5px;
        }

        .logo-box {
            position: relative;
            width: 90px; /* Трохи збільшили, щоб логотип читався ідеально */
            height: 90px;
            margin-bottom: 14px;
        }

        /* ПОВНЕОЧИЩЕННЯ ВІД РАМОК ТА КІЛ */
        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Логотип зберігає свої пропорції щита */
            /* Жодних border, background, padding чи border-radius! */
        }

        .online-dot {
            position: absolute;
            bottom: 0px;
            right: 4px;
            width: 12px;
            height: 12px;
            background: var(--green-glow);
            border: 2px solid var(--bg-main);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-glow);
        }

        .header-profile h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        /* Головна картка збору */
        .donation-block {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .block-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Реквізити */
        .crypto-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .crypto-card:hover {
            background: rgba(36, 43, 31, 0.2);
        }

        .number-slots {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .copy-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            background: var(--bg-main);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        /* Контейнер кнопок */
        .buttons-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* Стильна пласка кнопка */
        .btn-link {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 18px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.1s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-link:hover {
            background: #171b14;
            border-color: var(--text-muted);
        }

        .btn-link:active {
            transform: scale(0.98);
            background: var(--bg-main);
        }

        .icon-slot {
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
        }

        /* Чистий лаконічний підвал */
        .footer-text {
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="header-profile">
        <div class="logo-box">
            <img src="logo.png" alt="SVAROG">
            <div class="online-dot"></div>
        </div>
        <h1>SVAROG TEAM</h1>
    </div>

    <div class="donation-block">
        <div class="block-title">
            <span>Цільовий збір</span>
            <span style="color: var(--green-glow);">● АКТИВНО</span>
        </div>
        
        <a href="https://send.monobank.ua/" target="_blank" class="btn-link" style="background: var(--olive-active); border-color: #556547;">
            <span>Перейти на банку Моно</span>
            <span class="icon-slot">🏦</span>
        </a>

        <div class="crypto-card" onclick="copyAction()">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Натисніть для копіювання</span>
                <span class="number-slots" id="targetCard">4441 1111 2222 3333</span>
            </div>
            <span class="copy-badge" id="badge">Копіювати</span>
        </div>
    </div>

    <div class="buttons-grid">
        
        <a href="https://t.me/" target="_blank" class="btn-link">
            <span>Офіційний Telegram Канал</span>
            <span class="icon-slot">📱</span>
        </a>

        <a href="#" target="_blank" class="btn-link">
            <span>Зв'язок з Адміністрацією</span>
            <span class="icon-slot">🛡️</span>
        </a>

        <a href="#" target="_blank" class="btn-link">
            <span>Інструкція користувача</span>
            <span class="icon-slot">📄</span>
        </a>

    </div>

    <div class="footer-text">
        EST. 2026
    </div>

</div>

<script>
    function copyAction() {
        const text = document.getElementById('targetCard').innerText.replace(/\s/g, '');
        const badge = document.getElementById('badge');
        
        navigator.clipboard.writeText(text).then(() => {
            badge.innerText = "Готово";
            badge.style.color = "var(--green-glow)";
            badge.style.borderColor = "var(--green-glow)";
            
            setTimeout(() => {
                badge.innerText = "Копіювати";
                badge.style.color = "var(--text-muted)";
                badge.style.borderColor = "var(--border-color)";
            }, 1800);
        });
    }
</script>

</body>
</html>
