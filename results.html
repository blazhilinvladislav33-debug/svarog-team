<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бойовий Звіт | SVAROG TEAM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Підключаємо Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #0b0c0a;
            --card-bg: #121510;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #e3ded2;
            --text-muted: #8e8e93;
            --cyan-glow: #00ffcc;
            --theme-color: #798554;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 16px;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Шапка */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(121, 133, 84, 0.4));
        }

        .title-box h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        
        .title-box p {
            font-size: 12px;
            color: var(--theme-color);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Загальна статистика (Топ-блок) */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sum-card {
            background: rgba(121, 133, 84, 0.1);
            border: 1px solid rgba(121, 133, 84, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .sum-card.dest {
            background: rgba(0, 255, 204, 0.05);
            border-color: rgba(0, 255, 204, 0.2);
        }

        .sum-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .sum-value { font-size: 28px; font-weight: 800; }
        .sum-value.hit { color: var(--text-main); }
        .sum-value.dest { color: var(--cyan-glow); }

        /* Таблиця цілей */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            margin-bottom: 30px;
        }

        .table-header {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .col-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--cyan-glow);
            letter-spacing: 0.5px;
            width: 60px;
            text-align: center;
            line-height: 1.2;
        }

        .target-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        .target-row:last-child {
            border-bottom: none;
        }

        .target-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .target-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .target-name {
            font-size: 13px;
            font-weight: 500;
            color: #d1d1d1;
        }

        .target-stats {
            display: flex;
            gap: 15px;
        }

        .stat-num {
            width: 60px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .stat-num.zero {
            color: #444;
        }

        #loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 14px;
        }

        .last-update {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: -15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Шапка -->
    <div class="header">
        <img src="logo.png" alt="SVAROG" class="logo">
        <div class="title-box">
            <h1>Результати роботи</h1>
            <p>SVAROG TEAM</p>
        </div>
    </div>

    <div id="loading">📡 Синхронізація з базою даних...</div>

    <!-- Основний контент (прихований до завантаження) -->
    <div id="report-content" style="display: none;">
        
        <!-- Загальні цифри -->
        <div class="summary-grid">
            <div class="sum-card">
                <div class="sum-title">Усього уражено</div>
                <div class="sum-value hit" id="sum-hit">0</div>
            </div>
            <div class="sum-card dest">
                <div class="sum-title">З них знищено</div>
                <div class="sum-value dest" id="sum-dest">0</div>
            </div>
        </div>

        <!-- Детальна таблиця -->
        <div class="table-container">
            <div class="table-header">
                <div class="col-title">Уражено</div>
                <div class="col-title">В т.ч.<br>знищено</div>
            </div>
            
            <div id="targets-list">
                <!-- Рядки генеруватимуться автоматично -->
            </div>
        </div>

        <div class="last-update" id="update-time">Останнє оновлення: ...</div>
    </div>
</div>

<script>
    // 1. ІНІЦІАЛІЗАЦІЯ FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyAz5vZlnI7XwGhSXlKkX3DNAL13ECNegNk",
        authDomain: "svarog-team.firebaseapp.com",
        projectId: "svarog-team",
        storageBucket: "svarog-team.firebasestorage.app",
        messagingSenderId: "311449325528",
        appId: "1:311449325528:web:b254c6aed4fea56fe96cad"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. КАТЕГОРІЇ (Точно як в Адмінці) + Іконки
    const categoriesMap = [
        { id: "os_rov", ua: "ОС РОВ", icon: "🪖" },
        { id: "drone_points", ua: "Точки вильоту дронів", icon: "🎯" },
        { id: "antennas", ua: "Антени", icon: "📡" },
        { id: "air_defense", ua: "ЗРК, ЗГРК", icon: "🛡️" },
        { id: "aviation", ua: "Літаки та гелікоптери", icon: "✈️" },
        { id: "fleet", ua: "Флот", icon: "🚢" },
        { id: "radar_complex", ua: "РЛС, РЕР", icon: "📻" },
        { id: "radar_port", ua: "РЛС (портативні)", icon: "📟" },
        { id: "ew_complex", ua: "РЕБ (комплекс)", icon: "🚛" },
        { id: "ew_auto", ua: "РЕБ (авто)", icon: "🚙" },
        { id: "enemy_wings", ua: "Ворожі крила", icon: "🦅" },
        { id: "shaheds", ua: "Шахеди", icon: "🛩️" },
        { id: "tanks", ua: "Танки", icon: "🚜" },
        { id: "apc", ua: "ББМ, БМП, БТР", icon: "🦬" },
        { id: "artillery", ua: "Гармати", icon: "💥" },
        { id: "spg", ua: "САУ", icon: "🏗️" },
        { id: "mortars", ua: "Міномети", icon: "💣" },
        { id: "mlrs", ua: "РСЗВ", icon: "☄️" },
        { id: "vehicles", ua: "Техніка", icon: "🚚" },
        { id: "moto", ua: "Мотоцикли", icon: "🏍️" },
        { id: "depots", ua: "Склади", icon: "🏭" },
        { id: "strat_infra", ua: "Страт. інфраструктура", icon: "🌉" },
        { id: "tact_infra", ua: "Тактична інфраструктура", icon: "🛖" },
        { id: "trenches", ua: "Укриття", icon: "🛤️" },
        { id: "network", ua: "Камери / Мережа", icon: "👁️" },
        { id: "enemy_copters", ua: "Ворожі коптери", icon: "🚁" },
        { id: "other", ua: "Інше", icon: "❓" }
    ];

    // 3. СЛУХАЄМО ОНОВЛЕННЯ З БАЗИ
    db.collection("config").doc("combat_report").onSnapshot(doc => {
        if (doc.exists) {
            const data = doc.data();
            renderReport(data);
        }
    });

    function renderReport(data) {
        // Приховуємо завантаження, показуємо контент
        document.getElementById('loading').style.display = 'none';
        document.getElementById('report-content').style.display = 'block';

        // Заповнюємо загальні суми
        document.getElementById('sum-hit').innerText = data.totalHit || 0;
        document.getElementById('sum-dest').innerText = data.totalDest || 0;

        // Час оновлення
        if (data.lastUpdated) {
            const date = new Date(data.lastUpdated.toMillis());
            document.getElementById('update-time').innerText = `Останнє оновлення: ${date.toLocaleString('uk-UA')}`;
        }

        // Рендеримо таблицю
        const listContainer = document.getElementById('targets-list');
        listContainer.innerHTML = '';
        const details = data.details || {};

        categoriesMap.forEach(cat => {
            const hitCount = details[`${cat.id}_hit`] || 0;
            const destCount = details[`${cat.id}_dest`] || 0;
            
            // Візуальне затухання нулів, як на твоєму скріншоті
            const hitClass = hitCount === 0 ? "stat-num zero" : "stat-num";
            const destClass = destCount === 0 ? "stat-num zero" : "stat-num";

            listContainer.innerHTML += `
                <div class="target-row">
                    <div class="target-info">
                        <span class="target-icon">${cat.icon}</span>
                        <span class="target-name">${cat.ua}</span>
                    </div>
                    <div class="target-stats">
                        <span class="${hitClass}">${hitCount}</span>
                        <span class="${destClass}">${destCount}</span>
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
