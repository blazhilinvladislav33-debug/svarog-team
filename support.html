<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAROG TEAM | Зв'язок з нами</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAz5vZlnI7XwGhSXlKkX3DNAL13ECNegNk",
            authDomain: "svarog-team.firebaseapp.com",
            projectId: "svarog-team",
            storageBucket: "svarog-team.firebasestorage.app",
            messagingSenderId: "311449325528",
            appId: "1:311449325528:web:b254c6aed4fea56fe96cad",
            measurementId: "G-56T1VN72PF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; min-height: 100%; height: 100%; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            background-image: url('bg1.jpg'); background-attachment: fixed;
            background-position: center; background-repeat: no-repeat; background-size: cover;
            transition: background-image 1s ease-in-out;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.65); z-index: -1; }
        
        /* НАВІГАЦІЯ */
        .navbar { width: 100%; background-color: rgba(30, 30, 30, 0.75); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: fixed; top: 0; left: 0; z-index: 1000; }
        .navbar-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; }
        .left-side { display: flex; align-items: center; gap: 20px; }
        .menu-toggle { display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: none; border: none; padding: 10px; border-radius: 6px; transform: scale(0.85); transition: 0.3s; }
        .menu-toggle .bar { width: 22px; height: 3px; background-color: #ffffff; border-radius: 2px; }
        
        .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .logo-img { height: 40px; }
        .logo-main { font-size: 1.1rem; font-weight: 900; color: #ffffff; }
        .logo-sub { font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; }
        
        .nav-links { list-style: none; display: flex; flex-direction: column; width: 260px; background-color: rgba(20, 20, 20, 0.95); backdrop-filter: blur(15px); position: fixed; top: 65px; left: -280px; height: calc(100vh - 65px); padding: 30px 20px; gap: 10px; transition: 0.4s; }
        .nav-links.active { left: 0; }
        .nav-links a { color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 1.1rem; padding: 12px 15px; border-radius: 6px; }
        .nav-links a.current-page { color: #ffffff; border-left: 4px solid #ffffff; background-color: rgba(255, 255, 255, 0.12); }
        .admin-menu-item { padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 5px; }
        .menu-chat-btn { border: 2px solid #0099ff !important; color: #0099ff !important; font-weight: bold !important; text-align: center; }

        .main-content { margin-top: 100px; padding: 20px; display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; }
        .container { padding: 40px 30px; border-radius: 12px; background: linear-gradient(180deg, rgba(30, 30, 30, 0.95) 0%, rgba(20, 20, 20, 0.82) 100%); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); max-width: 550px; width: 100%; text-align: center; }
        .btn { display: block; padding: 12px; background: transparent; border: 2px solid #00ffcc; color: #00ffcc; border-radius: 4px; margin-top: 15px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #00ffcc; color: #121212; }
        input, textarea { padding: 12px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.15); width: 100%; border-radius: 4px; margin-bottom: 12px; }
        
        .social-box { display: flex; gap: 12px; margin-top: 25px; flex-direction: column; width: 100%; max-width: 550px; }
        .social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px; border-radius: 6px; text-decoration: none; font-weight: bold; color: #fff; border: 1px solid; transition: 0.3s; }

        /* ЧАТ */
        .user-chat-modal { display: none; position: fixed; bottom: 20px; right: 20px; width: 320px; height: 400px; background: rgba(20, 20, 20, 0.95); border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); z-index: 2000; flex-direction: column; overflow: hidden; }
        .chat-header { background: rgba(255,255,255,0.05); padding: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-bubble { padding: 8px 12px; border-radius: 8px; max-width: 80%; }
        .chat-bubble.user { background: rgba(255, 255, 255, 0.1); align-self: flex-end; }
        .chat-bubble.admin { background: rgba(0, 255, 204, 0.15); align-self: flex-start; }
        .chat-input-area { padding: 12px; display: flex; gap: 8px; background: rgba(0,0,0,0.25); align-items: center; }
        .chat-input-area input { flex: 1; height: 38px; padding: 0 14px; background: rgba(0,0,0,0.4); border-radius: 18px; color: #fff; }
        .chat-send-btn { width: 38px; height: 38px; background: #0099ff; border-radius: 50%; cursor: pointer; color: #fff; border: none; }
        .user-clip-btn { width: 38px; height: 38px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        @media (max-width: 768px) { body { background-attachment: scroll; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="left-side">
                <button class="menu-toggle" id="menu-button"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
                <a href="index.html" class="logo-container">
                    <img src="logo.png" alt="SVAROG" class="logo-img">
                    <div class="logo-text-group">
                        <span class="logo-main">SVAROG TEAM</span>
                        <span class="logo-sub">35 POLK NGU</span>
                    </div>
                </a>
            </div>
            <ul class="nav-links" id="nav-menu">
                <li><a href="index.html">Головна</a></li>
                <li><a href="support.html">Підтримка</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="contact.html" class="current-page">Зв'язок з нами</a></li>
                <li class="admin-menu-item"><a href="admin.html">Admin</a></li>
                <li><a href="#" class="menu-chat-btn" onclick="openUserChat(event)">💬 Анонімний чат</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <h1>Зв'язок з нами</h1>
            <form id="feedback-form" onsubmit="sendFeedback(event)">
                <input type="text" id="fb-name" placeholder="Ім'я" required>
                <input type="text" id="fb-contact" placeholder="Контакт" required>
                <textarea id="fb-message" placeholder="Повідомлення" required></textarea>
                <button type="submit" class="btn">Надіслати</button>
            </form>
        </div>
        <div class="social-box" id="dynamic-user-social-container"></div>
    </div>

    <div class="user-chat-modal" id="user-chat-window">
        <div class="chat-header"><span>Чат</span><span style="cursor:pointer" onclick="document.getElementById('user-chat-window').style.display='none'">×</span></div>
        <div class="chat-messages" id="user-chat-messages"></div>
        <div class="chat-input-area">
            <button class="user-clip-btn" onclick="document.getElementById('user-chat-file').click()">📎</button>
            <input type="file" id="user-chat-file" style="display:none;" onchange="sendUserChatPhoto(this)">
            <input type="text" id="user-chat-input" placeholder="...">
            <button class="chat-send-btn" onclick="sendUserChatMessage()">➤</button>
        </div>
    </div>

    <script>
        let userChatSessionId = localStorage.getItem('userChatSessionId') || 'session_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('userChatSessionId', userChatSessionId);

        // Firebase: Слухач чату
        db.collection("chats").doc(userChatSessionId).onSnapshot(doc => {
            const messagesBox = document.getElementById('user-chat-messages');
            messagesBox.innerHTML = "";
            if (doc.exists) {
                doc.data().messages.forEach(msg => {
                    const bubble = document.createElement('div');
                    bubble.className = `chat-bubble ${msg.sender}`;
                    bubble.innerText = msg.sender === 'user' ? msg.text : "Адмін: " + msg.text;
                    messagesBox.appendChild(bubble);
                });
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }
        });

        // Firebase: Відправка повідомлень
        async function sendUserChatMessage() {
            const input = document.getElementById('user-chat-input');
            if(!input.value.trim()) return;
            await db.collection("chats").doc(userChatSessionId).set({
                messages: firebase.firestore.FieldValue.arrayUnion({ sender: 'user', text: input.value, time: Date.now() })
            }, { merge: true });
            input.value = "";
        }

        // Firebase: Відправка заявки (Feedback)
        async function sendFeedback(e) {
            e.preventDefault();
            await db.collection("feedback").add({
                name: document.getElementById('fb-name').value,
                contact: document.getElementById('fb-contact').value,
                message: document.getElementById('fb-message').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                time: new Date().toLocaleString()
            });
            alert("Повідомлення надіслано!");
            document.getElementById('feedback-form').reset();
        }

        // Firebase: Соцмережі
        db.collection("config").doc("socials").onSnapshot(doc => {
            const box = document.getElementById('dynamic-user-social-container');
            const nets = doc.exists ? doc.data().list : [];
            box.innerHTML = nets.map(n => `<a href="${n.url}" class="social-btn" style="border-color:${n.color}">${n.name}</a>`).join('');
        });

        function openUserChat(e) { e.preventDefault(); document.getElementById('user-chat-window').style.display = 'flex'; }
        const menuButton = document.getElementById('menu-button');
        const navMenu = document.getElementById('nav-menu');
        menuButton.addEventListener('click', () => { navMenu.classList.toggle('active'); menuButton.classList.toggle('open'); });
    </script>
</body>
</html>
